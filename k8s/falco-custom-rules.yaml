# -----------------------------------------------------------------------------
# falco-custom-rules.yaml
#
# Custom Falco rules for todo-api cluster.
# - Suppresses noise from known infrastructure controllers (ArgoCD, Prometheus, ESO)
# - Adds high-value detections for real threats (shells, miners, secret reads, etc.)
# -----------------------------------------------------------------------------

# ---------- Lists of known/trusted process names ----------

- list: k8s_api_server_known_callers
  items: [argocd-applicat, argocd-server, argocd-repo-serv, kube-controller, prometheus, external-secrets]

- list: monitoring_known_callers
  items: [prometheus, grafana-server, alertmanager, node_exporter, kube-state-metrics]

- list: known_etc_writers
  items: [chronyd, ntpd, dhclient]

- list: known_outbound_callers
  items: [argocd-applicat, argocd-repo-serv, external-secrets, prometheus, falcosidekick, chronyd]

- list: known_secret_readers
  items:
    - argocd-applicat
    - argocd-server
    - argocd-repo-serv
    - external-secrets
    - kubelet
    - prometheus
    - operator
    - "Thread-2 (_watc"
    - "Thread-3 (_watc"
    - grafana-server

# ---------- Override: reduce noise from known infra talking to K8s API ----------
# Instead of redefining the whole rule (which breaks built-in macros like
# k8s_api_server), append an exception list to the existing default rule.

- rule: Contact K8S API Server From Container
  append: true
  exceptions:
    - name: known_infra_callers
      fields: [proc.name]
      comps: [in]
      values:
        - [k8s_api_server_known_callers]

# ---------- High-value threat detections ----------

- rule: Terminal shell in container
  desc: Detect a shell spawned inside a container — could indicate compromise
  condition: >
    spawned_process and container and
    shell_procs and proc.tty != 0 and
    container.image.repository != ""
  output: >
    Shell spawned in container (user=%user.name container_id=%container.id
    container_name=%container.name image=%container.image.repository
    k8s_pod=%k8s.pod.name k8s_ns=%k8s.ns.name command=%proc.cmdline)
  priority: WARNING
  tags: [container, shell, mitre_execution]

- rule: Detect crypto mining process
  desc: Detect known cryptominer process names
  condition: >
    spawned_process and
    proc.name in (xmrig, minerd, cpuminer, ethminer, cgminer)
  output: >
    Crypto mining process detected (proc=%proc.cmdline
    container=%container.name k8s_pod=%k8s.pod.name k8s_ns=%k8s.ns.name)
  priority: CRITICAL
  tags: [process, mitre_impact]

- rule: Read sensitive file untrusted
  desc: Detect attempts to read sensitive files like K8s service account tokens or kubeconfig
  condition: >
    open_read and
    (fd.name startswith /var/run/secrets/kubernetes.io or
     fd.name contains ".kube/config") and
    not proc.name in (known_secret_readers)
  output: >
    Sensitive file read (file=%fd.name proc=%proc.name
    container=%container.name k8s_pod=%k8s.pod.name k8s_ns=%k8s.ns.name)
  priority: WARNING
  tags: [filesystem, mitre_credential_access]

- rule: Launch Package Management Process in Container
  desc: Detect package installs at runtime — could indicate compromise or drift from immutable images
  condition: >
    spawned_process and container and
    proc.name in (apt, apt-get, yum, dnf, pip, pip3, npm)
  output: >
    Package management process launched in container
    (proc=%proc.cmdline container=%container.name k8s_pod=%k8s.pod.name k8s_ns=%k8s.ns.name)
  priority: NOTICE
  tags: [container, mitre_execution]

- rule: Write below etc
  desc: Detect file writes to /etc — could indicate persistence or tampering
  condition: >
    open_write and fd.directory = /etc and
    not proc.name in (known_etc_writers)
  output: >
    File written below /etc (file=%fd.name proc=%proc.name
    container=%container.name k8s_pod=%k8s.pod.name k8s_ns=%k8s.ns.name)
  priority: WARNING
  tags: [filesystem, mitre_persistence]

- rule: Unexpected outbound connection
  desc: Detect connections to uncommon external ports — could indicate exfiltration or C2
  condition: >
    outbound and not fd.sport in (80, 443, 53, 8080, 8443, 123) and
    not proc.name in (known_outbound_callers)
  output: >
    Unexpected outbound connection (proc=%proc.name dest=%fd.name
    container=%container.name k8s_pod=%k8s.pod.name k8s_ns=%k8s.ns.name)
  priority: WARNING
  tags: [network, mitre_exfiltration]