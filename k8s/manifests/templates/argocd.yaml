apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: todo-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Stefanie-A/production-ready-devops-project.git'
    targetRevision: HEAD
    path: k8s/manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    syncOptions:
      # Ensure the ArgoCD service account has permissions to create namespaces, or syncs may fail.
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true