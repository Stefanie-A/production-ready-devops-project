apiVersion: v1
kind: Service
metadata:
  name: todo-api
  namespace: app
  labels:
    app: todo-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: todo-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8000