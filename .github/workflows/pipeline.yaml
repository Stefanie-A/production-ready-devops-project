name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/stefanie-a/todo-api

permissions:
  contents: write
  packages: write
  security-events: write
  id-token: write
  actions: read

jobs:
  security-scan:
     name: Security Scan
     runs-on: ubuntu-latest
     steps:
      - uses: actions/checkout@v4

      - name: Gitleaks — Secret Detection
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bandit — Python SAST
        run: |
          pip install bandit
          bandit -r app/ -ll -ii

      - name: Checkov — IaC Security Scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true   # warn only; set false to block on IaC issues
  
  
  build-and-push:
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PAT }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('app/requirements.txt') }}

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run Tests
        env:
          METRICS_API_KEY: ${{ secrets.METRICS_API_KEY }}
          DATABASE_URL: sqlite:///./test.db
        run: |
          pytest test/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Trivy — Container Vulnerability Scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          exit-code: 1
          ignore-unfixed: true

      - name: Push Image
        run: |
          docker push \
          ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  Update-helm:
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4
      
      - name: Helm Lint
        run: helm lint k8s/manifests

      - name: Helm Template
        run: helm template k8s/manifests > /dev/null

      - name: Install yq
        uses: mikefarah/yq@v4

      - name: Update Helm Image Tag
        run: yq -i ".image.tag = \"${IMAGE_TAG}\"" k8s/manifests/values.yaml

      - name: Commit Updated Helm Values
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add k8s/manifests/values.yaml
          git diff --staged --quiet ||git commit -m "Update image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push
